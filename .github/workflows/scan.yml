name: Medici scan

on:
  schedule:
    # 06:00 UTC (10:00 Dubai) on the 1st and 15th. The 1st also runs the prospect scan.
    - cron: "0 6 1,15 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to scan"
        type: choice
        options: [reels, prospects, all, test]
        default: reels

concurrency: medici-scan

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -r scanner/requirements.txt
      - name: Pick mode
        id: mode
        run: |
          if [ -n "${{ github.event.inputs.mode }}" ]; then echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT";
          elif [ "$(date -u +%d)" = "01" ]; then echo "mode=all" >> "$GITHUB_OUTPUT";
          else echo "mode=reels" >> "$GITHUB_OUTPUT"; fi
      - name: Run scanner
        env:
          HQ_URL: ${{ secrets.HQ_URL }}
          SCANNER_TOKEN: ${{ secrets.SCANNER_TOKEN }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scanner/scan.py --mode "${{ steps.mode.outputs.mode }}"
        
